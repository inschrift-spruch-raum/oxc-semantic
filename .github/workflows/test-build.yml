name: test-build

# Manual-only entry: rewrite the package to a unique test version
# (0.1.0-test.<run_id>.<run_attempt>), build, pack the tarball and upload it
# together with a SHA256 manifest. Publishing never happens here: npm Trusted
# Publishing only allows one CI workflow per package, so the actual publish is
# done solely by npm-publish.yml through workflow_run.
"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1-threads

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rewrite package to the test version
        env:
          TEST_VERSION: 0.1.0-test.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Heredoc with a quoted delimiter: bash passes the body through
          # verbatim, so single quotes, backticks and $ in the JS are safe.
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs"
          const version = process.env.TEST_VERSION
          const file = "package.json"
          const pkg = JSON.parse(readFileSync(file, "utf8"))
          pkg.version = version
          writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n")
          console.log(`rewritten to ${version}`)
          EOF
          # Re-resolve so the lockfile stays consistent with the rewritten
          # manifest.
          pnpm install

      - name: Build
        run: pnpm run build

      - name: Pack tarball
        env:
          TEST_VERSION: 0.1.0-test.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oxc-semantic-packages"
          pnpm pack --pack-destination "$RUNNER_TEMP/oxc-semantic-packages"

      - name: Write manifest
        env:
          TEST_VERSION: 0.1.0-test.${{ github.run_id }}.${{ github.run_attempt }}
          PACK_DIR: ${{ runner.temp }}/oxc-semantic-packages
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { createHash } from "node:crypto"
          import { existsSync, readFileSync, writeFileSync } from "node:fs"
          const version = process.env.TEST_VERSION
          const file = `oxc-semantic-${version}.tgz`
          const path = `${process.env.PACK_DIR}/${file}`
          if (!existsSync(path)) {
            throw new Error(`missing tarball: ${path}`)
          }
          const sha256 = createHash("sha256")
            .update(readFileSync(path))
            .digest("hex")
          const manifest = {
            mode: "test",
            version,
            packages: [{ name: "oxc-semantic", file, sha256 }],
          }
          writeFileSync(
            `${process.env.PACK_DIR}/manifest.json`,
            JSON.stringify(manifest, null, 2) + "\n",
          )
          console.log(`manifest: oxc-semantic @ ${version}`)
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: oxc-semantic-packages
          path: ${{ runner.temp }}/oxc-semantic-packages
          retention-days: 14
